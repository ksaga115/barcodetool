name: Deploy to GitHub Pages

# BarcodeTool.html を push するたびに、GitHub Pages を自動で更新する。
# 手動アップロードも npm run dist も不要。commit → push だけ。
#
# 初回だけ: リポジトリの Settings → Pages → Source を「GitHub Actions」にする。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (single self-contained HTML)
        run: |
          mkdir _site
          cp BarcodeTool.html _site/index.html
          cp BarcodeTool.html _site/BarcodeTool.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
